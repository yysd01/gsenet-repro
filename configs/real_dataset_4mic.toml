[run]
seed = 0
device = "auto"
run_dir = ""

[data]
mode = "real_dir"
sample_rate = 16000
segment_seconds = 1.0
num_mics = 4
ref_mic_index = 0
root = "artifacts/dummy_real_dir_dataset"
split = "train"
random_crop = true
eval_full_length = false
fixed_crop = "center"
resample = true
cache_metadata = true
use_mcwf = 1
mcwf_causal_frames = 4

[stft_model]
n_fft = 320
win_length = 320
hop_length = 160
window = "hann"
center = false

[stft_loss]
n_fft = 1024
win_length = 1024
hop_length = 256

[model]
name = "gsenet_paper_scale"
leaky_relu_slope = 0.3
stem_channels = 16
head_channels = 2
remove_dc = false

[[model.encoder_blocks]]
cin = 16
cout = 32
stime = 1
sfreq = 2
dtime = false

[[model.encoder_blocks]]
cin = 32
cout = 48
stime = 2
sfreq = 2
dtime = false

[[model.encoder_blocks]]
cin = 48
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.encoder_blocks]]
cin = 48
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.encoder_blocks]]
cin = 96
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 96
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 96
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 48
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 48
cout = 32
stime = 2
sfreq = 2
dtime = false

[[model.decoder_blocks]]
cin = 32
cout = 16
stime = 1
sfreq = 2
dtime = false

[train]
batch_size = 4
num_steps = 2000
lr = 1e-4
log_every = 10
eval_every = 200
ckpt_every = 500
num_workers = 0
prefetch_factor = 2

[metrics]
enable_pesq = true
enable_sisdr = true
enable_sisnr = true
enable_snr = true

[pairing]
clean_prefix = "clean_"
mic_prefix = "mic_"
drop_last_underscore_segment = true
strict_pairing = false
