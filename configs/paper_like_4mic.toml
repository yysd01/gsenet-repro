[run]
seed = 0
device = "auto"
run_dir = ""

[data]
mode = "paper_like"
sample_rate = 16000
segment_seconds = 1.0
num_mics = 4
ref_mic_index = 1
mic_positions = [[0.0, 0.0, 0.0], [0.04, 0.0, 0.0], [0.01, 0.035, 0.0], [-0.03, 0.01, 0.0]]

[frontend]
type = "trace_norm"
gate_mode = "sector"
ref_ch = 1
diag_load_v = 1e-2
diag_load_x = 1e-3
eps_trace = 1e-6
psd_project = true
alpha_y = 0.92
alpha_v = 0.98
sector_half_angle_deg = 60.0
mic_pairs = [[0, 1], [0, 2], [1, 3]]
theta_s = 0.6
theta_t = 0.6
theta_i = 0.4
theta_n = 0.3
beta_speech_interf = 0.5

[stft_model]
n_fft = 320
win_length = 320
hop_length = 160
window = "hann"
center = false

[stft_loss]
n_fft = 1024
win_length = 1024
hop_length = 256

[model]
name = "gsenet_paper_scale"
leaky_relu_slope = 0.3
stem_channels = 16
head_channels = 2
remove_dc = false

[[model.encoder_blocks]]
cin = 16
cout = 32
stime = 1
sfreq = 2
dtime = false

[[model.encoder_blocks]]
cin = 32
cout = 48
stime = 2
sfreq = 2
dtime = false

[[model.encoder_blocks]]
cin = 48
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.encoder_blocks]]
cin = 48
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.encoder_blocks]]
cin = 96
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 96
cout = 96
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 96
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 48
cout = 48
stime = 1
sfreq = 2
dtime = true

[[model.decoder_blocks]]
cin = 48
cout = 32
stime = 2
sfreq = 2
dtime = false

[[model.decoder_blocks]]
cin = 32
cout = 16
stime = 1
sfreq = 2
dtime = false

[train]
batch_size = 4
num_steps = 2000
lr = 1e-4
log_every = 10
eval_every = 200
ckpt_every = 500
num_workers = 0
prefetch_factor = 2

[metrics]
enable_pesq = true
enable_sisdr = true
enable_sisnr = true
enable_snr = true
